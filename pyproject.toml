[project]
name = "sati"
version = "2.0.0"
description = "Statistical analysis of topographic image"
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Yuhki Kohsaka", email = "kohsaka.yuhki.3j@kyoto-u.ac.jp" },
]
dependencies = [
    "numpy>=2.3",
    "scipy>=1.5.0",
    "numexpr>=2.7.1",
    "scikit-image>=0.19.3",
]

[project.urls]
Repository = "https://github.com/yuksk/sati/"
Documentation = "https://yuksk.github.io/sati/index.html"

[dependency-groups]
dev = [
    "coverage[toml]>=5.2",
    "sphinx>=3.1.2",
    "sphinx-rtd-theme>=0.5.0",
]

[tool.coverage.run]
source = ["sati"]

[tool.coverage.report]
exclude_lines = ["except KeyboardInterrupt:"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"